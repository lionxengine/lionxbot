<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#FF6B35" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="50%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#FF4D00"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="#0C0C0E"/>
  <rect width="1200" height="480" fill="url(#glow)"/>

  <!-- Decorative dots -->
  <g fill="#FF6B35" opacity="0.5">
    <circle cx="120" cy="90" r="3"/>
    <circle cx="1080" cy="110" r="4"/>
    <circle cx="200" cy="380" r="2.5"/>
    <circle cx="1000" cy="360" r="3"/>
    <circle cx="880" cy="70" r="2"/>
    <circle cx="320" cy="120" r="2"/>
  </g>

  <!-- Top accent line -->
  <rect x="480" y="72" width="240" height="4" rx="2" fill="url(#lineGrad)"/>

  <!-- Title -->
  <text x="600" y="235" text-anchor="middle"
        font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="118" font-weight="800" letter-spacing="4"
        fill="url(#titleGrad)">LionX Bot</text>

  <!-- Subtitle -->
  <text x="600" y="300" text-anchor="middle"
        font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="500" letter-spacing="10"
        fill="#E8E8E8" opacity="0.85">KEYS &#8226; REWARDS &#8226; COMMUNITY</text>

  <!-- Bottom accent line -->
  <rect x="420" y="348" width="360" height="3" rx="1.5" fill="url(#lineGrad)"/>

  <!-- Bottom tagline -->
  <text x="600" y="398" text-anchor="middle"
        font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="400" letter-spacing="3"
        fill="#9A9AA0">Telegram Bot for LionX Engine</text>
</svg>
